<body>

    <h2>Sync de Forks (GitHub)</h2>

    <div class="top-section">
        <div class="input-col">
            <label for="token">Github API key</label>
            <input type="password" id="token" placeholder="Personal Access Token">
        </div>
        <div class="status-col" id="status-panel">
            <div id="status-title" class="status-title">Estado</div>
            <div id="progress" class="status-content">Esperando acción...</div>
        </div>
    </div>

    <div class="controls-bar">
        <div class="controls-group">
            <div class="control-item">
                <input type="checkbox" id="keepWorkflows">
                <label for="keepWorkflows">Mantener workflows activados</label>
            </div>
            <div class="control-item">
                <input type="checkbox" id="forceSync">
                <label for="forceSync" style="color: #f0883e; font-weight: 600;">⚡ Forzar sincronización (Sobrescribir conflictos)</label>
            </div>
        </div>

        <div class="controls-group">
            <div class="control-item">
                <label for="batchLimit" style="font-weight: 600;">Límite por lote:</label>
                <input type="number" id="batchLimit" min="0" value="50" style="width: 70px;" placeholder="0 = Todos" title="Número máximo de repositorios a procesar por lote (0 = sin límite)">
            </div>
            <div class="control-item">
                <label for="filterSelect">Mostrar:</label>
                <select id="filterSelect" onchange="renderForks()">
                    <option value="all">Todos los repositorios</option>
                    <option value="pending" selected>Sólo pendientes de actualizar</option>
                </select>
            </div>
            <div class="control-item">
                <label for="sortSelect">Ordenar por:</label>
                <select id="sortSelect" onchange="renderForks()">
                    <option value="status" selected>Estado (Pendientes primero)</option>
                    <option value="name">Nombre de repositorio</option>
                    <option value="fullname">Nombre completo (Owner/Repo)</option>
                </select>
            </div>
        </div>
    </div>

    <div class="controls-bar" style="margin-top: -5px; padding: 8px 15px;">
        <div class="controls-group">
            <div class="control-item">
                <input type="checkbox" id="selectAll" checked onchange="toggleSelectAll(this.checked)">
                <label for="selectAll" id="selectAllLabel" style="font-weight: 600;">Seleccionar / Deseleccionar todos los visibles</label>
            </div>
        </div>
        <div id="countSummary" style="font-size: 13px; color: #8b949e;">
            0 repositorios cargados
        </div>
    </div>

    <div class="actions">
        <button class="btn-secondary" onclick="loadForks()">Cargar / Recargar Forks</button>
        <button class="btn-secondary" onclick="disableWorkflowsSelected()">Desactivar Workflows (Seleccionados)</button>
        <button onclick="syncAll()">Sincronizar Seleccionados</button>
    </div>

    <div id="repos"></div>

    <script>
        /* ID: 20260812-2005.2 */

        let forks = [];

        function timeStr(date) {
            return date ? date.toTimeString().slice(0, 8) : "";
        }

        function formatDuration(ms) {
            const totalSecs = Math.round(ms / 1000);
            const h = Math.floor(totalSecs / 3600);
            const m = Math.floor((totalSecs % 3600) / 60);
            const s = totalSecs % 60;
            let p = [];
            if (h > 0) p.push(`${h}h`);
            if (m > 0 || h > 0) p.push(`${m}m`);
            p.push(`${s}s`);
            return p.join(' ');
        }

        function tokenValue() {
            return document.getElementById('token').value;
        }

        function keepWorkflows() {
            return document.getElementById('keepWorkflows').checked;
        }

        function forceSyncValue() {
            return document.getElementById('forceSync').checked;
        }

        function batchLimitValue() {
            const val = parseInt(document.getElementById('batchLimit').value, 10);
            return isNaN(val) || val <= 0 ? 0 : val;
        }

        // Obtener upstream real
        async function enrichWithParent(repo) {
            try {
                const res = await fetch(
                    `https://api.github.com/repos/${repo.owner.login}/${repo.name}`,
                    { headers: { Authorization: `Bearer ${tokenValue()}` } }
                );

                if (!res.ok) return repo;

                const full = await res.json();
                repo.parent = full.parent || null;
            } catch (e) {
                console.error("Error obteniendo upstream para", repo.name, e);
            }
            return repo;
        }

        // Cargar forks
        async function loadForks() {
            const reposDiv = document.getElementById('repos');
            reposDiv.innerHTML = "Cargando forks...";

            const statusTitle = document.getElementById('status-title');
            const progressDiv = document.getElementById('progress');
            statusTitle.innerText = "Análisis en curso";
            statusTitle.style.color = "#d29922";
            progressDiv.innerHTML = `Buscando repositorios... <br>Inicio: ${timeStr(new Date())}`;

            let page = 1;
            forks = [];

            const sleep = ms => new Promise(r => setTimeout(r, ms));

            while (true) {
                try {
                    const res = await fetch(`https://api.github.com/user/repos?per_page=100&page=${page}`, {
                        headers: { Authorization: `Bearer ${tokenValue()}` }
                    });
                    if (!res.ok) {
                        reposDiv.innerHTML = `<span class="err">Error de autenticación o API al obtener lista de repositorios (${res.status}).</span>`;
                        return;
                    }
                    const data = await res.json();
                    if (data.length === 0) break;

                    forks.push(...data.filter(r => r.fork));
                    page++;
                    await sleep(500);
                } catch (e) {
                    reposDiv.innerHTML = `<span class="err">Error de red Crítico al listar repositorios.</span>`;
                    return;
                }
            }

            reposDiv.innerHTML = "";
            const globalStart = new Date();

            const limit = batchLimitValue();
            const toAnalyzeCount = limit > 0 ? Math.min(forks.length, limit) : forks.length;

            for (let i = 0; i < toAnalyzeCount; i++) {
                progressDiv.innerHTML = `
                    Repositorios encontrados: ${forks.length} (Límite por lote: ${limit > 0 ? limit : 'Sin límite'})<br>
                    Hora de inicio: ${timeStr(globalStart)}<br>
                    Analizando: ${i + 1}/${toAnalyzeCount} (Actualizado: ${timeStr(new Date())})<br>
                    Analizando ahora: <strong>${forks[i].full_name}</strong>
                `;

                forks[i] = await enrichWithParent(forks[i]);
                await sleep(350);

                if (forks[i].parent) {
                    forks[i].cmp = await isBehind(forks[i], forks[i].default_branch);
                    await sleep(350);
                }

                // Por defecto, marcar como seleccionado si requiere actualización o si se desea procesar
                forks[i].selected = !!(forks[i].parent && forks[i].cmp && forks[i].cmp.behind);
            }

            const globalEnd = new Date();
            const durationStr = formatDuration(globalEnd - globalStart);
            const countUpdate = forks.slice(0, toAnalyzeCount).filter(r => r.parent && r.cmp && r.cmp.behind).length;

            statusTitle.innerText = "Análisis finalizado";
            statusTitle.style.color = "#3fb950";
            progressDiv.innerHTML = `
                Repositorios analizados: <strong>${toAnalyzeCount}</strong> de ${forks.length} totales<br>
                Requieren actualización: <strong>${countUpdate}</strong><br>
                Hora de inicio: ${timeStr(globalStart)} | Fin: ${timeStr(globalEnd)} (${durationStr})
            `;

            renderForks();
        }

        function toggleSelectAll(checked) {
            const filter = document.getElementById('filterSelect').value;
            const visibleForks = getFilteredForks(filter);
            visibleForks.forEach(r => { r.selected = checked; });
            renderForks();
        }

        function toggleRepoSelect(repoName, checked) {
            const repo = forks.find(r => r.name === repoName);
            if (repo) repo.selected = checked;
            updateSummary();
        }

        function getFilteredForks(filter) {
            if (filter === "pending") {
                return forks.filter(r => r.parent && r.cmp && r.cmp.behind);
            }
            return [...forks];
        }

        function getSortedForks(list, sortKey) {
            const sorted = [...list];
            if (sortKey === "status") {
                const getScore = r => {
                    if (!r.parent) return 4;
                    if (r.cmp && r.cmp.error) return 3;
                    if (r.cmp && r.cmp.behind) return 1; // Pendiente primero
                    return 2; // Actualizado
                };
                sorted.sort((a, b) => getScore(a) - getScore(b) || a.name.localeCompare(b.name));
            } else if (sortKey === "name") {
                sorted.sort((a, b) => a.name.localeCompare(b.name));
            } else if (sortKey === "fullname") {
                sorted.sort((a, b) => a.full_name.localeCompare(b.full_name));
            }
            return sorted;
        }

        function updateSummary() {
            const filter = document.getElementById('filterSelect').value;
            const visible = getFilteredForks(filter);
            const selectedCount = visible.filter(r => r.selected).length;
            const countSummary = document.getElementById('countSummary');
            if (countSummary) {
                countSummary.innerHTML = `Mostrando: <strong>${visible.length}</strong> / Total: <strong>${forks.length}</strong> (Seleccionados: <strong>${selectedCount}</strong>)`;
            }
        }

        // Actualización dinámica en tiempo real de la tarjeta del repositorio
        function updateRepoCardUI(repoName) {
            const repo = forks.find(r => r.name === repoName);
            if (!repo) return;

            const badgeDiv = document.getElementById(`status-badge-${repo.name}`);
            const btn = document.getElementById(`btn-${repo.name}`);

            let syncStatusHTML = "";
            let btnDisabled = false;
            let syncBtnText = `Sync (${repo.default_branch})`;

            if (!repo.parent) {
                syncStatusHTML = `<span class="badge badge-warn">Sin upstream</span>`;
                btnDisabled = true;
            } else if (repo.cmp && repo.cmp.error) {
                syncStatusHTML = `<span class="badge badge-err">Error API</span>`;
            } else if (repo.cmp && !repo.cmp.behind) {
                syncStatusHTML = `<span class="badge badge-ok">✅ Actualizado</span>`;
                syncBtnText = "Actualizado";
                btnDisabled = true;
            } else if (repo.cmp && repo.cmp.behind) {
                syncStatusHTML = `<span class="badge badge-warn">⚠️ Atrás por ${repo.cmp.raw.behind_by || '?'} commits</span>`;
            }

            if (badgeDiv) badgeDiv.innerHTML = syncStatusHTML;
            if (btn) {
                btn.innerText = syncBtnText;
                btn.disabled = btnDisabled;
            }
            updateSummary();
        }

        // Render UI
        function renderForks() {
            const reposDiv = document.getElementById('repos');
            reposDiv.innerHTML = "";

            const filter = document.getElementById('filterSelect').value;
            const sortKey = document.getElementById('sortSelect').value;

            const visibleForks = getFilteredForks(filter);
            const sortedForks = getSortedForks(visibleForks, sortKey);

            updateSummary();

            if (sortedForks.length === 0) {
                reposDiv.innerHTML = `<div style="padding: 20px; text-align: center; color: #8b949e;">No hay repositorios que coincidan con el filtro.</div>`;
                return;
            }

            sortedForks.forEach(repo => {
                const div = document.createElement('div');
                div.className = 'repo';

                let syncStatusHTML = "";
                let btnDisabled = "";
                let syncBtnText = `Sync (${repo.default_branch})`;

                if (!repo.parent) {
                    syncStatusHTML = `<span class="badge badge-warn">Sin upstream</span>`;
                    btnDisabled = "disabled";
                } else if (repo.cmp && repo.cmp.error) {
                    syncStatusHTML = `<span class="badge badge-err">Error API</span>`;
                } else if (repo.cmp && !repo.cmp.behind) {
                    syncStatusHTML = `<span class="badge badge-ok">✅ Actualizado</span>`;
                    syncBtnText = "Actualizado";
                    btnDisabled = "disabled";
                } else if (repo.cmp && repo.cmp.behind) {
                    syncStatusHTML = `<span class="badge badge-warn">⚠️ Atrás por ${repo.cmp.raw.behind_by || '?'} commits</span>`;
                }

                const isChecked = repo.selected !== false ? "checked" : "";

                div.innerHTML = `
                    <div class="repo-header">
                        <div class="repo-title-group">
                            <input type="checkbox" id="chk-${repo.name}" ${isChecked} onchange="toggleRepoSelect('${repo.name}', this.checked)">
                            <span class="repo-name">${repo.full_name}</span>
                        </div>
                        <div id="status-badge-${repo.name}">${syncStatusHTML}</div>
                    </div>
                    <div class="meta">
                        Branch: <strong>${repo.default_branch}</strong> | 
                        Upstream: <strong>${repo.parent ? repo.parent.full_name : "❌ none"}</strong>
                    </div>
                    <div class="repo-body" style="margin-top: 8px;">
                        <div class="log" id="log-${repo.name}"></div>
                        <button id="btn-${repo.name}" ${btnDisabled} style="min-width: 140px;"
                            onclick="processRepo('${repo.owner.login}', '${repo.name}', '${repo.default_branch}')">
                            ${syncBtnText}
                        </button>
                    </div>
                `;

                reposDiv.appendChild(div);
            });
        }

        // 🔥 Comparación robusta desde upstream
        async function isBehind(repo, branch) {
            const upstream = repo.parent.full_name;
            const upstreamBranch = repo.parent.default_branch;

            const url = `https://api.github.com/repos/${upstream}/compare/${upstreamBranch}...${repo.owner.login}:${branch}`;

            try {
                const res = await fetch(url, {
                    headers: { Authorization: `Bearer ${tokenValue()}` }
                });

                if (!res.ok) {
                    return { error: true, status: res.status };
                }

                const data = await res.json();

                return {
                    behind: data.behind_by > 0,
                    raw: data
                };
            } catch (e) {
                console.error("Fallo de red/CORS en isBehind:", e);
                return { error: true, exception: true };
            }
        }

        // Sincronización Forzada (Hard Reset ref via PATCH)
        async function forceSyncRepo(owner, repoName, branch) {
            const repo = forks.find(r => r.name === repoName);
            const log = document.getElementById(`log-${repoName}`);

            log.className = "log warn";
            log.innerText = "Obteniendo commit SHA de upstream...";

            const upstreamOwner = repo.parent.owner.login;
            const upstreamRepo = repo.parent.name;
            const upstreamBranch = repo.parent.default_branch;

            let upstreamSha = null;

            try {
                const refRes = await fetch(
                    `https://api.github.com/repos/${upstreamOwner}/${upstreamRepo}/git/ref/heads/${upstreamBranch}`,
                    { headers: { Authorization: `Bearer ${tokenValue()}`, Accept: "application/vnd.github+json" } }
                );
                if (refRes.ok) {
                    const refData = await refRes.json();
                    upstreamSha = refData.object ? refData.object.sha : refData.sha;
                } else {
                    const commitRes = await fetch(
                        `https://api.github.com/repos/${upstreamOwner}/${upstreamRepo}/commits/${upstreamBranch}`,
                        { headers: { Authorization: `Bearer ${tokenValue()}`, Accept: "application/vnd.github+json" } }
                    );
                    if (commitRes.ok) {
                        const commitData = await commitRes.json();
                        upstreamSha = commitData.sha;
                    }
                }
            } catch (e) {
                log.className = "log err";
                log.innerText = "Error de red al obtener SHA de upstream.";
                return false;
            }

            if (!upstreamSha) {
                log.className = "log err";
                log.innerText = "No se pudo obtener el commit SHA de upstream.";
                return false;
            }

            log.innerText = "Forzando actualización de la rama (Sobrescribiendo)...";

            try {
                const patchRes = await fetch(
                    `https://api.github.com/repos/${owner}/${repoName}/git/refs/heads/${branch}`,
                    {
                        method: "PATCH",
                        headers: {
                            Authorization: `Bearer ${tokenValue()}`,
                            Accept: "application/vnd.github+json",
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ sha: upstreamSha, force: true })
                    }
                );

                if (patchRes.ok) {
                    return true;
                } else {
                    const errObj = await patchRes.json().catch(() => ({}));
                    log.className = "log err";
                    log.innerText = `Error al forzar sync: ${errObj.message || patchRes.status}`;
                    return false;
                }
            } catch (e) {
                log.className = "log err";
                log.innerText = "Error de red al forzar sincronización.";
                return false;
            }
        }

        // Proceso por repo
        async function processRepo(owner, repoName, branch) {
            const repo = forks.find(r => r.name === repoName);
            const log = document.getElementById(`log-${repoName}`);
            const btn = document.getElementById(`btn-${repoName}`);

            if (!repo.parent) {
                log.className = "log warn";
                log.innerText = "Sin upstream configurado";
                return;
            }

            log.className = "log warn";
            log.innerText = "Comparando...";

            const cmp = await isBehind(repo, branch);

            if (cmp.error) {
                log.className = "log err";
                log.innerText = "Error al comparar ramas (limitación API)";
                return;
            }

            let workflowsDisabled = false;
            let wfCountBefore = 0;

            // Si 'Mantener workflows activados' está DESACTIVADO (desmarcado), forzar desactivación previa
            if (!keepWorkflows()) {
                log.innerText = "Desactivando workflows y Actions forzadamente...";
                const dr = await disableWorkflows(owner, repoName);
                if (dr && dr.success === false) {
                    log.className = "log err";
                    log.innerText = `Error API workflows: ${dr.error} (¿Falta permiso 'workflow' en token?)`;
                    return;
                } else if (dr && dr.success) {
                    workflowsDisabled = true;
                    wfCountBefore = dr.count;
                }
            }

            if (!cmp.behind && !forceSyncValue()) {
                log.className = "log ok";
                log.innerText = workflowsDisabled
                    ? `✅ Actualizado (Workflows y Actions desactivados: ${wfCountBefore})`
                    : "✅ Repositorio ya actualizado";
                updateRepoCardUI(repoName);
                return;
            }

            await syncRepo(owner, repoName, branch, workflowsDisabled, wfCountBefore);
        }

        // Sync + limpieza
        async function syncRepo(owner, repoName, branch, alreadyDisabledWf, wfCountBefore) {
            const repo = forks.find(r => r.name === repoName);
            const log = document.getElementById(`log-${repoName}`);
            const btn = document.getElementById(`btn-${repoName}`);

            log.innerText = "Sincronizando...";

            let syncSuccess = false;
            let isForcedSync = false;

            if (forceSyncValue()) {
                syncSuccess = await forceSyncRepo(owner, repoName, branch);
                isForcedSync = true;
            } else {
                let res;
                try {
                    res = await fetch(`https://api.github.com/repos/${owner}/${repoName}/merge-upstream`, {
                        method: "POST",
                        headers: {
                            Authorization: `Bearer ${tokenValue()}`,
                            Accept: "application/vnd.github+json"
                        },
                        body: JSON.stringify({ branch })
                    });
                } catch (e) {
                    log.className = "log err";
                    log.innerText = "Error crítico de red al sincronizar.";
                    return;
                }

                if (res.status === 200 || res.status === 204) {
                    syncSuccess = true;
                } else {
                    const err = await res.json().catch(() => ({}));

                    if (err.message && err.message.includes("workflow")) {
                        log.className = "log warn";
                        log.innerText = "Bloqueado por permisos de workflows. Aplicando Sincronización Forzada...";
                        syncSuccess = await forceSyncRepo(owner, repoName, branch);
                        isForcedSync = true;
                        if (!syncSuccess) return;
                    } else if (err.message && err.message.includes("conflict")) {
                        log.className = "log warn";
                        log.innerText = "Conflictos detectados. Reintentando con Sincronización Forzada...";
                        syncSuccess = await forceSyncRepo(owner, repoName, branch);
                        isForcedSync = true;
                        if (!syncSuccess) return;
                    } else {
                        log.className = "log err";
                        log.innerText = err.message || "Error desconocido";
                        return;
                    }
                }
            }

            if (syncSuccess) {
                if (repo.cmp) {
                    repo.cmp.behind = false;
                    if (repo.cmp.raw) repo.cmp.raw.behind_by = 0;
                }

                let extMsg = "";
                if (!keepWorkflows()) {
                    log.innerText = "Deshabilitando workflows y Actions forzadamente...";
                    const dr = await disableWorkflows(owner, repoName);
                    if (dr && dr.success === false) {
                        log.className = "log err";
                        log.innerText = `Sincronizado OK, pero falló desactivación de workflows: ${dr.error}`;
                        return;
                    }
                    const total = (dr && dr.success ? dr.count : 0) + (wfCountBefore || 0);
                    extMsg = ` (Workflows y Actions desactivados: ${total})`;
                }

                log.className = "log ok";
                log.innerText = isForcedSync
                    ? `✅ Repositorio sincronizado (Forzado/Sobrescrito)${extMsg}`
                    : `✅ Repositorio actualizado${extMsg}`;
                
                // Actualizar inmediatamente el badge y botón de la tarjeta en tiempo real
                updateRepoCardUI(repoName);
            }
        }

        // Deshabilitar workflows individualmente y a nivel de permisos de repositorio
        async function disableWorkflows(owner, repoName) {
            // 1. Deshabilitar Actions a nivel global de repositorio (Apagado completo de Actions)
            try {
                await fetch(
                    `https://api.github.com/repos/${owner}/${repoName}/actions/permissions`,
                    {
                        method: "PUT",
                        headers: { Authorization: `Bearer ${tokenValue()}`, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
                        body: JSON.stringify({ enabled: false })
                    }
                );
            } catch (e) { }

            // 2. Deshabilitar cada workflow activo individualmente
            let res;
            try {
                res = await fetch(
                    `https://api.github.com/repos/${owner}/${repoName}/actions/workflows`,
                    { headers: { Authorization: `Bearer ${tokenValue()}`, Accept: "application/vnd.github+json" } }
                );
            } catch (e) { return { success: false, error: "Error de red" }; }

            if (!res.ok) {
                const errObj = await res.json().catch(() => ({}));
                return { success: false, error: errObj.message || `HTTP ${res.status}` };
            }

            const data = await res.json();
            let disabledCount = 0;

            for (const wf of data.workflows || []) {
                if (wf.state === 'active') {
                    try {
                        let dRes = await fetch(
                            `https://api.github.com/repos/${owner}/${repoName}/actions/workflows/${wf.id}/disable`,
                            {
                                method: "PUT",
                                headers: {
                                    Authorization: `Bearer ${tokenValue()}`,
                                    Accept: "application/vnd.github+json"
                                }
                            }
                        );
                        if (dRes.ok) disabledCount++;
                    } catch (e) { }
                }
            }
            return { success: true, count: disabledCount };
        }

        // Acciones masivas para deshabilitar workflows en seleccionados con soporte de lote
        async function disableWorkflowsSelected() {
            const statusTitle = document.getElementById('status-title');
            const progressDiv = document.getElementById('progress');

            let toProcess = forks.filter(r => r.selected !== false);
            const limit = batchLimitValue();

            if (toProcess.length === 0) {
                alert("No hay repositorios seleccionados.");
                return;
            }

            const totalSelected = toProcess.length;
            if (limit > 0 && toProcess.length > limit) {
                toProcess = toProcess.slice(0, limit);
            }

            let processed = 0;
            let totalDisabledWorkflows = 0;
            statusTitle.innerText = "Desactivación de Workflows en curso";
            statusTitle.style.color = "#d29922";
            const globalStart = new Date();

            for (const repo of toProcess) {
                const log = document.getElementById(`log-${repo.name}`);
                if (log) {
                    log.className = "log warn";
                    log.innerText = "Desactivando workflows...";
                }

                progressDiv.innerHTML = `
                    Procesando lote: ${toProcess.length} repositorios (Seleccionados totales: ${totalSelected})<br>
                    Hora de inicio: ${timeStr(globalStart)}<br>
                    Repositorios procesados: ${processed}/${toProcess.length} (Actualizado: ${timeStr(new Date())})<br>
                    Procesando ahora: <strong>${repo.full_name}</strong>
                `;

                const res = await disableWorkflows(repo.owner.login, repo.name);
                processed++;

                if (log) {
                    if (res && res.success) {
                        totalDisabledWorkflows += res.count;
                        log.className = "log ok";
                        log.innerText = `✅ Workflows desactivados (${res.count} workflows desactivados, Actions OFF)`;
                    } else {
                        log.className = "log err";
                        log.innerText = `Error al desactivar workflows: ${res ? res.error : "Error desconocido"}`;
                    }
                }
            }

            const globalEnd = new Date();
            const durationStr = formatDuration(globalEnd - globalStart);

            statusTitle.innerText = "Desactivación de Workflows finalizada";
            statusTitle.style.color = "#3fb950";
            progressDiv.innerHTML = `
                Repositorios procesados en lote: ${processed}/${toProcess.length} (Total seleccionados: ${totalSelected})<br>
                Total workflows desactivados: <strong>${totalDisabledWorkflows}</strong><br>
                Hora de inicio: ${timeStr(globalStart)} | Fin: ${timeStr(globalEnd)} (${durationStr})
            `;
        }

        // Sync masivo (sólo seleccionados con límite por lote)
        async function syncAll() {
            const statusTitle = document.getElementById('status-title');
            const progressDiv = document.getElementById('progress');

            let toSync = forks.filter(r => {
                if (r.selected === false) return false;
                if (!r.parent || !r.cmp || r.cmp.error) return false;
                if (r.cmp.behind) return true;
                if (forceSyncValue()) return true;
                if (!keepWorkflows()) return true;
                return false;
            });

            const limit = batchLimitValue();

            if (toSync.length === 0) {
                alert("No hay repositorios seleccionados pendientes de sincronización.");
                return;
            }

            const totalPending = toSync.length;
            if (limit > 0 && toSync.length > limit) {
                toSync = toSync.slice(0, limit);
            }

            let processed = 0;
            statusTitle.innerText = "Sincronización en curso";
            statusTitle.style.color = "#d29922";
            const globalStart = new Date();

            for (const repo of toSync) {
                progressDiv.innerHTML = `
                    Sincronizando lote: ${toSync.length} repositorios (Pendientes totales: ${totalPending})<br>
                    Hora de inicio: ${timeStr(globalStart)}<br>
                    Repositorios procesados: ${processed}/${toSync.length} (Actualizado: ${timeStr(new Date())})<br>
                    Procesando ahora: <strong>${repo.full_name}</strong>
                `;
                await processRepo(repo.owner.login, repo.name, repo.default_branch);
                processed++;
            }

            const globalEnd = new Date();
            const durationStr = formatDuration(globalEnd - globalStart);

            statusTitle.innerText = "Sincronización finalizada";
            statusTitle.style.color = "#3fb950";
            progressDiv.innerHTML = `
                Lote procesado: ${processed}/${toSync.length} (Pendientes totales iniciales: ${totalPending})<br>
                Hora de inicio: ${timeStr(globalStart)} | Fin: ${timeStr(globalEnd)} (${durationStr})
            `;
        }
    </script>
